services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    container_name: agentdev_backend
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:6400:6400"
    env_file:
      - .env
    environment:
      BACKEND_BIND: 0.0.0.0
      # Vite proxy in the frontend container reaches the backend with Host: backend:6400
      AGENTDEV_ALLOWED_HOSTS: backend
      CORS_ALLOW_ORIGINS: http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: agentdev_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    env_file:
      - .env
    environment:
      # Vite dev proxy runs inside the container, so target the backend service name
      VITE_API_BASE_URL: http://backend:6400
    depends_on:
      - backend
    restart: unless-stopped
