<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/media/logo.svg?v=2" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AgentDev: trò chuyện với trưởng nhóm AI để điều phối đội agent, quy trình và kỹ năng." />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#1a1a1a" />
  <title>AgentDev</title>
  <!-- Critical paint colours: match main.css tokens so the first frame never flashes white -->
  <style>
    html { background: #1a1a1a; }
    html[data-theme="light"] { background: #f3f5f9; }
  </style>
  <script>
    // Apply the saved theme before first paint to avoid a flash of the wrong theme.
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem("agent_config_settings") || "{}");
        var t = s.THEME || "dark";
        if (t === "system") t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
      // Keep the browser chrome colour in step with the theme, including later switches.
      var syncChrome = function () {
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.content = document.documentElement.dataset.theme === "light" ? "#f3f5f9" : "#1a1a1a";
      };
      syncChrome();
      new MutationObserver(syncChrome).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
    })();
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
