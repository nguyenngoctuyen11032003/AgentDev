name: Validate YAML Workflows

on:
  pull_request:
    paths:
      - 'workspace/workflows/**/*.yaml'
      - '.github/workflows/**/*.yml'
      - 'backend/scripts/validate_all_yamls.py'
      - 'backend/**/*.py'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
  
  push:
    branches:
      - main
    paths:
      - 'workspace/workflows/**/*.yaml'
      - '.github/workflows/**/*.yml'
      - 'backend/scripts/validate_all_yamls.py'
      - 'backend/**/*.py'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
  
  workflow_dispatch:

jobs:
  validate:
    name: Validate YAML Configuration Files
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'

      - name: Install system dependencies for pycairo
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config
      
      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            backend/.venv
          key: ${{ runner.os }}-uv-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      
      - name: Install dependencies
        run: uv sync
      
      - name: Run YAML validation
        run: uv run python -m scripts.validate_all_yamls
      
      - name: Report validation success
        if: success()
        run: echo "All YAML workflow files passed validation"

      - name: Report validation failure
        if: failure()
        run: echo "YAML validation failed - check the logs above for details"
