version: 0.4.0
vars: {}
graph:
  id: software_company
  description: 'Công ty phần mềm chuyên nghiệp. CTO quản lý kế hoạch và đội ngũ chuyên gia (PM, Kiến trúc sư, Dev, QA, Reviewer). Quy trình nghiêm ngặt: Kế hoạch duyệt trước -> Triển khai -> QA & Nghiệm thu -> Báo cáo đầy đủ.'
  log_level: INFO
  is_majority_voting: false
  start:
    - CTO
  end:
    - CTO
  nodes:
    # ------------------------------------------------------------------ lead
    # Routing, planning, briefing and the final report are injected by the team protocol; the role only
    # adds what is specific to this company. No skills: their full text would ride on every tool round.
    - id: CTO
      type: agent
      description: 'Giám đốc công nghệ, đầu mối duy nhất, phê duyệt kế hoạch và báo cáo cuối'
      config:
        provider: gemini
        name: gemini-3.1-pro-preview
        role: |-
          You are the CTO of a software company. You own the technical outcome and client communication.

          Triage: Answer greetings or team questions briefly (max 3 sentences) in the user's language. Say you are the CTO and the only contact.

          PLAN FIRST: For any new project or major feature, your reply MUST be a plan first. 
          - Requirements as a checklist (R1, R2...).
          - Stack, Size (N/L), and Phases.
          - Ask for "OK" to start. STOP there.

          EXECUTION (After approval): Delegate in 3 parallel batches as defined before.
          - Every brief must include the R1..Rn list and docs/*.md paths.
          - Verification: After a fix round, always call QA Tester. If the previous round was REJECTED by the Acceptance Reviewer, call them ONE more time to verify the fix.

          FINAL REPORT (User's language): 
          - Quote the client's approval exactly.
          - R1..Rn checklist with status (Xong / Một phần / Chưa).
          - For apps with login: Must list the Login URL/Route and Demo Accounts (explicitly stating passwords are from env vars as per README).
          - List of created/changed files. CHECK that regression test files exist in the list.
          - Last line: `Đã kiểm chứng: <lệnh QA> → <kết quả>` or `Chưa kiểm chứng: <lý do>`.
        team:
          enabled: true
          plan_approval: true
          max_delegations: 12
          max_review_rounds: 1
          max_parallel: 4
          members:
            - Code Scout
            - Project Manager
            - Solution Architect
            - Data Engineer
            - Backend Lead
            - Backend Developer
            - Frontend Developer
            - UI UX Designer
            - Bug Fixer
            - QA Tester
            - Acceptance Reviewer
            - DevOps Engineer
        tooling:
          - type: function
            config:
              tools:
                - name: list_directory
                - name: read_file_segment
                - name: search_in_files
                - name: save_file
                - name: apply_text_edits
        params:
          effort: low
          max_tokens: 8000  # coordinator: briefs, progress notes and replies, no large code
          tool_loop_limit: 25

    # ------------------------------------------------------------------ staff (no edges: called by the CTO)
        skills:
          enabled: true
          allow:
            - name: brainstorming
      mascot: 13
    - id: Code Scout
      type: agent
      description: 'Trinh sát mã nguồn, tìm vị trí file:dòng'
      config:
        provider: gemini
        name: gemini-3-flash-preview
        role: 'Read-only scout. Find relevant files/symbols. Report `path:line - description` anchors. No plans or edits.'
        tooling:
          - type: function
            config:
              tools:
                - name: list_directory
                - name: read_file_segment
                - name: search_in_files
        params:
          effort: low
          max_tokens: 4000
    - id: Project Manager
      type: agent
      description: 'Viết tài liệu yêu cầu và danh sách việc'
      config:
        provider: gemini
        name: gemini-3.1-pro-preview
        role: |-
          Write docs/requirements.md (with R1..Rn IDs) and docs/tasks.md based on the approved plan. Do not write code.
        tooling: &doc_tools
          - type: function
            config:
              tools:
                - name: list_directory
                - name: read_file_segment
                - name: search_in_files
                - name: save_file
                - name: apply_text_edits
        params:
          effort: low
          max_tokens: 8000
    - id: Solution Architect
      type: agent
      description: Thiết kế kiến trúc hệ thống và API
      config:
        provider: gemini
        name: gemini-3.1-pro-preview
        role: |-
          Design system architecture and API contracts in docs/architecture.md. No TODOs. Define DB schema clearly.
        tooling: *doc_tools
        params:
          effort: low
          max_tokens: 8000  # one short architecture note per call
    - id: Data Engineer
      type: agent
      description: 'Thiết kế và cài đặt CSDL, seed dữ liệu'
      config:
        provider: gemini
        name: gemini-3.1-pro-preview
        role: |-
          Implement schema, migrations, and seed. Seed secrets (passwords) MUST come from environment variables, listed in .env.example. 
          Login accounts: Create ONE demo account per role, list in README `## Tài khoản demo`.
        tooling:
          - type: function
            config:
              tools:
                - name: list_directory
                - name: read_file_segment
                - name: search_in_files
                - name: save_file
                - name: apply_text_edits
                - name: run_shell_command
        native_mode:
          enabled: true
          allow_commands: true
          max_turns: 15
        params:
          effort: medium
          max_tokens: 16000  # code edits go through tools in small steps
    - id: Backend Lead
      type: agent
      description: "Trưởng nhóm backend, thiết kế và review"
      config:
        provider: gemini
        name: gemini-3.1-pro-preview
        role: 'Set up structure, implement core logic, delegate to Backend Developer. Report: changed files and verification line.'
        team:
          enabled: true
          plan_approval: false
          max_delegations: 4
          max_review_rounds: 1
          max_parallel: 1
          members:
            - Backend Developer
        tooling:
          - type: function
            config:
              tools:
                - name: list_directory
                - name: read_file_segment
                - name: search_in_files
                - name: save_file
                - name: apply_text_edits
                - name: execute_code
                - name: run_shell_command
        params:
          effort: medium
          max_tokens: 16000  # code edits go through tools in small steps
    - id: Backend Developer
      type: agent
      description: Lập trình API và logic backend
      config:
        provider: gemini
        name: gemini-3.1-pro-preview
        role: |-
          Implement features and tests. For login apps: Add a test that verifies login with every account in README. 
          Check entry file (syntax/imports) before finishing. No hardcoded secrets.
        tooling:
          - type: function
            config:
              tools:
                - name: list_directory
                - name: read_file_segment
                - name: search_in_files
                - name: save_file
                - name: apply_text_edits
                - name: execute_code
                - name: run_shell_command
        native_mode:
          enabled: true
          allow_commands: true
          max_turns: 12
        params:
          effort: medium
          max_tokens: 16000  # code edits go through tools in small steps

    - id: Frontend Developer
      type: agent
      description: Lập trình giao diện responsive và cân đối
      config:
        provider: gemini
        name: gemini-3.1-pro-preview
        role: |-
          Build screens. REQUISITE: Giao diện phải cân đối, full khung, khít khớp bố cục, phù hợp cả laptop và mobile. 
          Use impeccable skill for polish pass on consumer-facing projects. Validate all inputs.
        skills:
          enabled: true
          allow:
            - name: frontend-ui-engineering
            - name: design-taste-frontend
            - name: impeccable
        tooling:
          - type: function
            config:
              tools:
                - name: list_directory
                - name: read_file_segment
                - name: search_in_files
                - name: save_file
                - name: apply_text_edits
                - name: execute_code
                - name: run_shell_command
        native_mode:
          enabled: true
          allow_commands: true
          max_turns: 12
        params:
          effort: medium
          max_tokens: 16000  # code edits go through tools in small steps

    - id: UI UX Designer
      type: agent
      description: Thiết kế giao diện và trải nghiệm người dùng
      config:
        provider: gemini
        name: gemini-3.1-pro-preview
        role: |-
          Create docs/design.md with layout, tokens, and states. Ensure balanced and professional look. 
          For consumer-facing: Use high-end-visual-design skill.
        skills:
          enabled: true
          allow:
            - name: ui-ux-pro-max
            - name: design-taste-frontend
            - name: high-end-visual-design
        tooling:
          - type: function
            config:
              tools:
                - name: list_directory
                - name: read_file_segment
                - name: search_in_files
                - name: save_file
                - name: apply_text_edits
                - name: execute_code
        params:
          effort: low
          max_tokens: 12000
    - id: Bug Fixer
      type: agent
      description: Sửa lỗi và viết test hồi quy cố định
      config:
        provider: gemini
        name: gemini-3.1-pro-preview
        role: |-
          Fix bugs. MANDATORY: Always create a regression test file (e.g. test/fix.test.js) and run it.
          No git init if not present. Use .bak only for client's original files. Report cause and fix.
        skills:
          enabled: true
          allow:
            - name: systematic-debugging
            - name: verification-before-completion
        tooling:
          - type: function
            config:
              tools:
                - name: list_directory
                - name: read_file_segment
                - name: search_in_files
                - name: save_file
                - name: apply_text_edits
                - name: execute_code
                - name: run_shell_command
        native_mode:
          enabled: true
          allow_commands: true
          max_turns: 15
        params:
          effort: medium
          max_tokens: 16000  # code edits go through tools in small steps

    # Haiku: QA runs scripted checks and reports evidence; the Acceptance Reviewer (Sonnet) is the gate on
    # big deliveries, and on small fixes a false PASS is cheap to catch.
    - id: QA Tester
      type: agent
      description: Kiểm thử và báo PASS/FAIL rõ ràng
      config:
        provider: gemini
        name: gemini-3-flash-preview
        role: |-
          Test against R1..Rn. Always run the full test suite once. 
          Verdict first: Put PASS or FAIL on the FIRST line. 
          Login check: Verify demo accounts from README. No database servers.
        tooling:
          - type: function
            config:
              tools:
                - name: list_directory
                - name: read_file_segment
                - name: search_in_files
                - name: save_file
                - name: apply_text_edits
                - name: execute_code
                - name: run_shell_command
        native_mode:
          enabled: true
          allow_commands: true
          max_turns: 12
        params:
          effort: low
          max_tokens: 16000

    - id: Acceptance Reviewer
      type: agent
      description: "Nghiệm thu chất lượng mã và yêu cầu"
      config:
        provider: gemini
        name: gemini-3.1-pro-preview
        role: |-
          Final check of R1..Rn. Verify code standards: input validation, no secrets, README commands.
          Login check: README must have demo accounts with URL. Block if missing or hardcoded.
          Answer ACCEPTED or REJECTED first.
        skills:
          enabled: true
          allow:
            - name: code-review-and-quality
        tooling:
          - type: function
            config:
              tools:
                - name: list_directory
                - name: read_file_segment
                - name: search_in_files
                - name: run_shell_command
        params:
          effort: low
          max_tokens: 8000
    - id: DevOps Engineer
      type: agent
      description: Triển khai và cấu hình môi trường
      config:
        provider: gemini
        name: gemini-3-flash-preview
        role: 'Set up Docker, CI/CD, and environment. No secrets in repo. Report build/deploy commands.'
        tooling:
          - type: function
            config:
              tools:
                - name: list_directory
                - name: read_file_segment
                - name: search_in_files
                - name: save_file
                - name: apply_text_edits
                - name: execute_code
                - name: run_shell_command
        native_mode:
          enabled: true
          allow_commands: true
          max_turns: 12
        params:
          effort: medium
          max_tokens: 16000
  edges: []
