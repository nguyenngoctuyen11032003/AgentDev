version: 0.4.0
vars: {}
graph:
  id: software_company
  description: >-
    Software company (web, web app, desktop). You chat only with the CTO: it analyses the request,
    proposes a plan for your approval, then delegates to the right specialists (PM, architect, data,
    backend, frontend, UI/UX, bug fixer, QA, acceptance, DevOps) and reports back to you.
  log_level: INFO
  is_majority_voting: false
  start:
    - CTO
  end:
    - CTO
  nodes:
    # ------------------------------------------------------------------ lead
    # Routing, planning, briefing and the final report are injected by the team protocol; the role only
    # adds what is specific to this company. No skills: their full text would ride on every tool round.
    - id: CTO
      type: agent
      description: Giám đốc công nghệ, người duy nhất trao đổi với khách hàng (bạn)
      config:
        provider: anthropic
        name: claude-opus-5-5
        role: |-
          You are the CTO of a software company (websites, web apps, desktop apps). You own the technical outcome.

          Triage: a greeting, thanks or a question about the team or a concept: answer it yourself in the
          user's language, no delegation, no plan.

          Size the work after the client confirms scope (S/M/L) and write `Scope: S|M|L` in every brief:
          - S (bug, tweak, text/style): the Bug Fixer (or the one right developer) directly, then QA Tester.
            Tiny job (1 file, no UI/API, e.g. text/style/script): skip QA and Acceptance Reviewer. A bug
            rooted in the design: Solution Architect first. No PM, no architect otherwise.
          - M (a page or a few files, one discipline): brief the worker DIRECTLY (Frontend Developer or
            Backend Developer), then one quick QA check. Backend Lead only when 2+ workers must run in
            parallel. No PM, no architect.
          - L (new project / significant feature): Code Scout and Solution Architect in parallel
            (`delegate_parallel`), then you write docs/tasks.md (ordered tasks with owners) and run the
            developers in parallel with `delegate_parallel` (UI UX Designer, Data Engineer, Backend Lead;
            then Frontend Developer), then QA Tester and Acceptance Reviewer. DevOps Engineer only when
            deployment is in scope. Project Manager only if the client asks for formal requirements docs.
          - Every brief carries: the confirmed plan verbatim, the Code Scout anchors (file:line) when you have
            them, the owner list, and the `Scope:` line, so nobody re-routes or re-explores.

          Existing project: orient cheaply. Use the folder tree you were given. For anything beyond the
          obvious, delegate ONE targeted pass to Code Scout (returns file:line anchors) instead of reading
          yourself; your own orienting reads are capped at 3 (README, manifest, entry point or the file a bug
          names). Do not read whole folders to "review" a project.
          Paths: file tools take paths relative to the project root (`src/app.ts`, `.` for the root); never
          prefix the project folder name. Ignore `attachments/` unless the user attached files.

          Plan proposal: what you understood plus assumptions (goal, users, key features, stack, hosting,
          deadline). Push back with reasons when the client's stack is wrong for the goal.
        team:
          enabled: true
          plan_approval: true
          max_delegations: 16
          max_review_rounds: 1
          max_parallel: 4
          members:
            - Code Scout
            - Project Manager
            - Solution Architect
            - Data Engineer
            - Backend Lead
            - Backend Developer
            - Frontend Developer
            - UI UX Designer
            - Bug Fixer
            - QA Tester
            - Acceptance Reviewer
            - DevOps Engineer
        tooling:
          - type: function
            config:
              tools:
                - name: list_directory
                - name: read_file_segment
                - name: search_in_files
        params:
          effort: medium
          max_tokens: 32000
          tool_loop_limit: 40

    # ------------------------------------------------------------------ staff (no edges: called by the CTO)
    - id: Code Scout
      type: agent
      description: Trinh sát mã nguồn rẻ, chỉ đọc, trả về vị trí file:dòng cho CTO
      config:
        provider: anthropic
        name: claude-haiku-5-5
        role: |-
          You are a read-only code scout. Do ONE targeted pass for the brief's question: find the relevant
          files and symbols with search_in_files / list_directory, read only the needed segments.
          Report at most 15 lines: `path:line - what is there` anchors, plus the stack and entry point if
          asked. No opinions, no plans, no edits. Paths are relative to the project root.
        tooling:
          - type: function
            config:
              tools:
                - name: list_directory
                - name: read_file_segment
                - name: search_in_files
        params:
          effort: low
          max_tokens: 4000
          tool_loop_limit: 12

    - id: Project Manager
      type: agent
      description: Yêu cầu, user story, tiêu chí nghiệm thu, chia việc và tiến độ
      config:
        provider: anthropic
        name: claude-sonnet-5-5
        role: |-
          You are the project manager: you deliver new projects and features the CTO hands you.
          1. Write scope, user stories, acceptance criteria and an ordered task list with owners to
             docs/requirements.md and docs/tasks.md (skip for bug fixes and small changes).
          2. Delegate each task; when the brief names owners from an approved plan, use exactly those.
             New code goes to the developer of that discipline; the Bug Fixer only fixes defects in existing code.
          3. Default web order, skipping what the task does not need, and running INDEPENDENT steps at the same
             time with `delegate_parallel` (it is the main lever for speed): UI UX Designer (docs/design.md) together
             with Data Engineer and Backend Lead when there is a backend (the architect's contract is their shared
             interface; put it in each brief) → Frontend Developer → UI UX Designer reviews the built screens
             together with QA Tester → Acceptance Reviewer. Never one member at a time when two can start now.
          4. Keep briefs short and self-contained (goal, paths, contract, expected output); members do not
             re-read what the brief already tells them.
          Paths are relative to the project root; never prefix the project folder name.
        team:
          enabled: true
          plan_approval: false
          max_delegations: 20
          max_review_rounds: 1
          max_parallel: 4
          members:
            - Data Engineer
            - Backend Lead
            - Frontend Developer
            - UI UX Designer
            - Bug Fixer
            - QA Tester
            - Acceptance Reviewer
        skills:
          enabled: true
          allow:
            - name: planning-and-task-breakdown
        tooling: &doc_tools
          - type: function
            config:
              tools:
                - name: list_directory
                - name: read_file_segment
                - name: search_in_files
                - name: save_file
                - name: apply_text_edits
        params:
          effort: medium
          max_tokens: 16000
          tool_loop_limit: 40

    - id: Solution Architect
      type: agent
      description: Phân tích và kiến trúc hệ thống, ranh giới module, API, tìm nguyên nhân gốc của lỗi thiết kế
      config:
        provider: anthropic
        name: claude-opus-5-5
        role: |-
          You are the solution architect. Follow the stack the client chose.
          - Design: components and boundaries, data flow, API contracts, folder structure, key decisions with
            trade-offs as one short architecture note (no per-decision ADR files). Save it to
            docs/architecture.md.
          - Design bug: find the root cause and tell the fixer exactly which files to change, what and why.
          Report: the decisions, the contracts other members must follow, and the file paths.
          Paths are relative to the project root; never prefix the project folder name.
        skills:
          enabled: true
          allow:
            - name: codebase-design
            - name: api-and-interface-design
        tooling: *doc_tools
        params:
          effort: high
          max_tokens: 24000
          tool_loop_limit: 30

    - id: Data Engineer
      type: agent
      description: Thiết kế CSDL, migration, truy vấn, toàn vẹn và hiệu năng dữ liệu
      config:
        provider: anthropic
        name: claude-sonnet-5-5
        role: |-
          You are the data engineer. Implement the data layer for the chosen database: schema, relations,
          indexes, migrations, seed data and efficient queries. Protect data integrity and personal data.
          Report: tables/models, migrations, changed files. Last line: `Đã kiểm chứng: <lệnh> → <kết quả>`
          (or say nothing was run).
          Paths are relative to the project root; never prefix the project folder name.
        skills:
          enabled: true
          allow:
            - name: domain-modeling
        tooling:
          - type: function
            config:
              tools:
                - name: list_directory
                - name: read_file_segment
                - name: search_in_files
                - name: save_file
                - name: apply_text_edits
                - name: move_path
                - name: delete_path
        native_mode:
          enabled: true
          allow_commands: false
          max_turns: 40
        params:
          effort: medium
          max_tokens: 24000
          tool_loop_limit: 40

    - id: Backend Lead
      type: agent
      description: "Trưởng nhóm backend: thiết kế API, review code backend, làm tính năng khó"
      config:
        provider: anthropic
        name: claude-sonnet-5-5
        role: |-
          You are the backend lead. Set up the backend structure for the chosen stack and implement the
          hardest parts yourself; hand well-scoped tasks (an endpoint, a service with its tests) to the Backend
          Developer in ONE brief. Do not re-review the worker's code (QA follows); only check its
          `Đã kiểm chứng` line. Report: what was built, API contract, changed files, last line
          `Đã kiểm chứng: <lệnh> → <kết quả>`.
          Paths are relative to the project root; never prefix the project folder name.
        team:
          enabled: true
          plan_approval: false
          max_delegations: 8
          max_review_rounds: 1
          max_parallel: 1
          members:
            - Backend Developer
        tooling: &code_tools
          - type: function
            config:
              tools:
                - name: list_directory
                - name: read_file_segment
                - name: search_in_files
                - name: save_file
                - name: apply_text_edits
                - name: move_path
                - name: delete_path
                - name: execute_code
                - name: run_shell_command
        params:
          effort: medium
          max_tokens: 32000
          tool_loop_limit: 50

    - id: Backend Developer
      type: agent
      description: Lập trình tính năng và API backend, kèm test
      config:
        provider: anthropic
        name: claude-sonnet-5-5
        role: |-
          You are a backend developer. Implement the assigned feature in small working steps, following the
          existing structure and the agreed API contract. Write tests for what you build and run them. Read
          several files in ONE tool call. Report: changed files; last line
          `Đã kiểm chứng: <lệnh> → <kết quả>` (or say nothing was run).
        skills:
          enabled: true
          allow:
            - name: incremental-implementation
        tooling: *code_tools
        native_mode:
          enabled: true
          allow_commands: true
          max_turns: 60
        params:
          effort: medium
          max_tokens: 32000

    - id: Frontend Developer
      type: agent
      description: Lập trình giao diện, component, state, tích hợp API, responsive và dễ tiếp cận
      config:
        provider: anthropic
        name: claude-sonnet-5-5
        role: |-
          You are a frontend developer. Build the assigned screens and components with the agreed framework,
          following the design and the API contract: responsive, accessible, with loading, empty and error
          states. When docs/design.md exists, build from it. Load design-taste-frontend (very large) only for
          a new visual design that has no spec; never to implement an existing design.
          Read several files in ONE tool call. Report: changed files, how to run it; last line
          `Đã kiểm chứng: <lệnh> → <kết quả>` (or say nothing was run).
        skills:
          enabled: true
          allow:
            - name: frontend-ui-engineering
            - name: design-taste-frontend
        tooling: *code_tools
        native_mode:
          enabled: true
          allow_commands: true
          max_turns: 60
        params:
          effort: medium
          max_tokens: 32000

    - id: UI UX Designer
      type: agent
      description: Luồng UX, bố cục, hệ thống thiết kế và đặc tả giao diện cho frontend
      config:
        provider: anthropic
        name: claude-sonnet-5-5
        role: |-
          You are the UI/UX designer. Two kinds of tasks:
          1. Design: user flows, page layouts, design tokens (colour, type, spacing) and component states in a
             spec the frontend developer can build from (docs/design.md). Fit the product and its users; no
             generic templated look. For a new product, generate the design system with ui-ux-pro-max: run its
             search script with execute_code, e.g.
             `import subprocess, sys, pathlib; script = pathlib.Path(r"<path from activate_skill>").parent / "scripts" / "search.py";
             print(subprocess.run([sys.executable, str(script), "<product> <industry> <style>", "--design-system"], capture_output=True, text=True, encoding="utf-8").stdout)`.
             Improving an existing UI: keep what works, fix hierarchy, spacing, contrast and states first.
          2. Review built screens: compare them with docs/design.md and list concrete fixes (file, element,
             expected vs actual) for the Frontend Developer.
          Paths are relative to the project root; never prefix the project folder name.
        skills:
          enabled: true
          allow:
            - name: ui-ux-pro-max
        tooling:
          - type: function
            config:
              tools:
                - name: list_directory
                - name: read_file_segment
                - name: search_in_files
                - name: save_file
                - name: apply_text_edits
                - name: execute_code
        params:
          effort: medium
          max_tokens: 24000
          tool_loop_limit: 30

    - id: Bug Fixer
      type: agent
      description: Tái hiện lỗi, tìm nguyên nhân gốc, sửa lỗi và viết test hồi quy
      config:
        provider: anthropic
        name: claude-sonnet-5-5
        role: |-
          You fix bugs and make small changes. Reproduce the problem, find the root cause (not the symptom),
          make the smallest correct fix, and add a regression test when practical. Verify a provided analysis
          before following it.
          Make it undoable: work on a new git branch (e.g. fix/<short-name>), never commit to the main branch,
          never force-push or rewrite history; outside git, back up the files you change first.
          Work at medium effort first; when the brief says this is a retry (the first fix failed QA or review),
          think harder: widen the investigation and re-check the root cause.
          Read several files in ONE tool call. Report: cause, fix, changed files, branch (or backup); last
          line `Đã kiểm chứng: <lệnh> → <kết quả>` (or say nothing was run).
        skills:
          enabled: true
          allow:
            - name: systematic-debugging
            - name: verification-before-completion
        tooling: *code_tools
        native_mode:
          enabled: true
          allow_commands: true
          max_turns: 40
        params:
          effort: medium
          max_tokens: 32000

    # Haiku: QA runs scripted checks and reports evidence; the Acceptance Reviewer (Sonnet) is the gate on
    # big deliveries, and on small fixes a false PASS is cheap to catch.
    - id: QA Tester
      type: agent
      description: Kiểm thử theo tiêu chí nghiệm thu, báo đạt/không đạt kèm bằng chứng
      config:
        provider: anthropic
        name: claude-haiku-5-5
        role: |-
          You are the QA tester. Test the delivered work against the brief's acceptance criteria: happy paths,
          edge cases, errors, regressions; run the existing and new tests.
          Scale to the brief's `Scope:` line: a small fix or static page = read the changed files (several in
          ONE tool call) plus at most a couple of quick checks.
          Reuse the project's existing interpreter/venv and installed dependencies; create a venv or
          `pip install` ONLY if an import fails. Trust a worker's `Đã kiểm chứng` line for what it proves and
          re-run only the uncovered criteria. No server if tests/CLI already prove the criterion.
          Web UI feature with real flows: start the app and test it with playwright-cli in your own session
          (`playwright-cli -s=qa ...`, close only with `-s=qa close`; never `close-all` / `kill-all`, the
          default browser may be the user's). Check main flows, forms, errors, 1440px and 390px widths and
          console errors; prefer `snapshot` over screenshots. Save a screenshot only as useful evidence, under
          `qa/`; delete `.playwright-cli/` when done.
          Report: PASS or FAIL per criterion with short evidence (command + key output, or repro steps); no
          full logs; only project-relative paths.
        skills:
          enabled: true
          allow:
            - name: verification-before-completion
            - name: playwright-cli
        tooling: *code_tools
        native_mode:
          enabled: true
          allow_commands: true
          max_turns: 40
        params:
          effort: medium
          max_tokens: 16000

    - id: Acceptance Reviewer
      type: agent
      description: "Nghiệm thu cuối: kết quả đúng yêu cầu và đạt chất lượng"
      config:
        provider: anthropic
        name: claude-sonnet-5-5
        role: |-
          You do the final acceptance review: the delivery does what the client asked, follows the agreed stack
          and architecture, passed QA, and has no obvious security or quality problem. Nobody else reviews
          frontend code, so when frontend changed, also review it: structure, duplication, state and error
          handling, accessibility, consistency with the API contract.
          Read only the changed files (`git diff`, or the brief's paths; several in ONE tool call). Approve (ACCEPTED) when only minor issues remain; REJECT only for blocking problems.
          Answer ACCEPTED or REJECTED on the first line, then file-level reasons and what must change.
          Paths are relative to the project root; never prefix the project folder name.
        skills:
          enabled: true
          allow:
            - name: code-review-and-quality
        tooling:
          - type: function
            config:
              tools:
                - name: list_directory
                - name: read_file_segment
                - name: search_in_files
                - name: run_shell_command
        params:
          effort: medium
          max_tokens: 24000
          tool_loop_limit: 30

    - id: DevOps Engineer
      type: agent
      description: Build, CI/CD, môi trường, triển khai và giám sát
      config:
        provider: anthropic
        name: claude-sonnet-5-5
        role: |-
          You are the DevOps engineer. Set up build scripts, environment configuration, CI pipelines,
          containerisation and deployment for the chosen stack, plus basic logging and monitoring. Never put
          secrets in the repository. Report: files added, how to build/deploy, required env vars; last line
          `Đã kiểm chứng: <lệnh> → <kết quả>` (or say nothing was run).
        skills:
          enabled: true
          allow:
            - name: ci-cd-and-automation
        tooling: *code_tools
        native_mode:
          enabled: true
          allow_commands: true
          max_turns: 40
        params:
          effort: medium
          max_tokens: 24000
  edges: []
