    - {from: Intake, to: Render Approval, keep_message: true, condition: {type: keyword, config: {regex: ['^\s*RENDER\b'], case_sensitive: true}}}
    # The renderer reads the episode number from the request (EPISODE ... tập N / RENDER ... tập N).
    - {from: Intake, to: Video Renderer, trigger: false, keep_message: true}
    - {from: Writer, to: Script Reviewer}
    - {from: Writer, to: Script Approval, trigger: false, clear_context: true}
    - {from: Writer, to: Visual Director, trigger: false, clear_context: true, keep_message: true}
    - {from: Writer, to: Voice & Subtitles, trigger: false, clear_context: true, keep_message: true}
    - {from: Writer, to: Thumbnail Title, trigger: false, clear_context: true, keep_message: true}
    - {from: Writer, to: Production QA, trigger: false, clear_context: true, keep_message: true}
    - {from: Writer, to: Archivist, trigger: false, clear_context: true}
    - {from: Script Reviewer, to: Writer, condition: {type: keyword, config: {regex: ['^(?!\W*APPROVED\b)'], case_sensitive: true}}}
    - {from: Script Reviewer, to: Script Guard, condition: {type: keyword, config: {regex: ['^(?!\W*APPROVED\b)'], case_sensitive: true}}}
    - from: Script Reviewer
      to: Archivist
      trigger: false
    - from: Script Guard
      to: Writer
    - {from: Script Guard, to: Script Approval}
    - from: Script Guard
      to: Archivist
      trigger: false
    - {from: Script Reviewer, to: Script Approval, condition: {type: keyword, config: {regex: ['^\W*APPROVED\b'], case_sensitive: true}}}
    - {from: Script Approval, to: Visual Director, condition: {type: keyword, config: {regex: ['^\s*((ok|oke|okay|duyệt|duyet|đã duyệt|đồng ý|dong y)(\W+(nhé|nhe|nha|rồi|roi|luôn|ạ|tiếp tục|tiếp))*\W*$|\[Automatic answer)'], case_sensitive: false}}}
    - {from: Script Approval, to: Voice & Subtitles, condition: {type: keyword, config: {regex: ['^\s*((ok|oke|okay|duyệt|duyet|đã duyệt|đồng ý|dong y)(\W+(nhé|nhe|nha|rồi|roi|luôn|ạ|tiếp tục|tiếp))*\W*$|\[Automatic answer)'], case_sensitive: false}}}
    - {from: Script Approval, to: Thumbnail Title, condition: {type: keyword, config: {regex: ['^\s*((ok|oke|okay|duyệt|duyet|đã duyệt|đồng ý|dong y)(\W+(nhé|nhe|nha|rồi|roi|luôn|ạ|tiếp tục|tiếp))*\W*$|\[Automatic answer)'], case_sensitive: false}}}
    - {from: Script Approval, to: Writer, condition: {type: keyword, config: {regex: ['^(?!\s*((ok|oke|okay|duyệt|duyet|đã duyệt|đồng ý|dong y)(\W+(nhé|nhe|nha|rồi|roi|luôn|ạ|tiếp tục|tiếp))*\W*$|\[Automatic answer))'], case_sensitive: false}}}
    - {from: Visual Director, to: Production QA}
    # Voice and title run in parallel before the production loop; trigger: false lets QA (the loop entry is
    # Visual Director) run once with all three outputs instead of once per branch.
    - {from: Voice & Subtitles, to: Production QA, trigger: false}
    - {from: Thumbnail Title, to: Production QA, trigger: false}
    - {from: Production QA, to: Video Approval}
    - {from: Video Approval, to: Archivist, condition: {type: keyword, config: {regex: ['^\s*((ok|oke|okay|duyệt|duyet|đã duyệt|đồng ý|dong y)(\W+(nhé|nhe|nha|rồi|roi|luôn|ạ|tiếp tục|tiếp))*\W*$|\[Automatic answer)'], case_sensitive: false}}}
    - {from: Video Approval, to: Visual Director, condition: {type: keyword, config: {regex: ['^(?!\s*((ok|oke|okay|duyệt|duyet|đã duyệt|đồng ý|dong y)(\W+(nhé|nhe|nha|rồi|roi|luôn|ạ|tiếp tục|tiếp))*\W*$|\[Automatic answer))'], case_sensitive: false}}}
    - {from: Video Approval, to: Production Guard, condition: {type: keyword, config: {regex: ['^(?!\s*((ok|oke|okay|duyệt|duyet|đã duyệt|đồng ý|dong y)(\W+(nhé|nhe|nha|rồi|roi|luôn|ạ|tiếp tục|tiếp))*\W*$|\[Automatic answer))'], case_sensitive: false}}}
    # Production Guard stays silent for the first 3 rounds of notes (each one is applied) and speaks on the 4th.
    # Its edge back to Visual Director only keeps it inside the loop: a counter outside the loop would end the
    # loop on the first note, and
    # an edge back to Video Approval would form an inner loop that is left (towards Visual Director) before the
    # counter runs. When it speaks, the edge to Final Approval (outside the loop) wins and the loop ends.
    - {from: Production Guard, to: Visual Director}
    - {from: Production Guard, to: Final Approval}
    - {from: Final Approval, to: Archivist, condition: {type: keyword, config: {regex: ['^\s*((ok|oke|okay|duyệt|duyet|đã duyệt|đồng ý|dong y)(\W+(nhé|nhe|nha|rồi|roi|luôn|ạ|tiếp tục|tiếp))*\W*$|\[Automatic answer)'], case_sensitive: false}}}
    # Video costs money: only an explicit "tạo video" renders it. The Lab's automatic answer, a timeout or any
    # other reply skips it, and the production package stays as it is.
    - {from: Video Approval, to: Render Approval, condition: {type: keyword, config: {regex: ['^\s*((ok|oke|okay|duyệt|duyet|đã duyệt|đồng ý|dong y)(\W+(nhé|nhe|nha|rồi|roi|luôn|ạ|tiếp tục|tiếp))*\W*$|\[Automatic answer)'], case_sensitive: false}}}
    - {from: Final Approval, to: Render Approval, condition: {type: keyword, config: {regex: ['^\s*((ok|oke|okay|duyệt|duyet|đã duyệt|đồng ý|dong y)(\W+(nhé|nhe|nha|rồi|roi|luôn|ạ|tiếp tục|tiếp))*\W*$|\[Automatic answer)'], case_sensitive: false}}}
    - {from: Render Approval, to: Video Renderer, condition: {type: keyword, config: {regex: ['^\s*((ok|có|co|đồng ý|dong y)\W*)?(tạo|tao)\s+video\b'], case_sensitive: false}}}
    - {from: Render Approval, to: Render Skipped, condition: {type: keyword, config: {regex: ['^(?!\s*((ok|có|co|đồng ý|dong y)\W*)?(tạo|tao)\s+video\b)'], case_sensitive: false}}}
    - {from: Final Approval, to: Production Stopped, condition: {type: keyword, config: {regex: ['^(?!\s*((ok|oke|okay|duyệt|duyet|đã duyệt|đồng ý|dong y)(\W+(nhé|nhe|nha|rồi|roi|luôn|ạ|tiếp tục|tiếp))*\W*$|\[Automatic answer))'], case_sensitive: false}}}
