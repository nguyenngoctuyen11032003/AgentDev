version: 0.4.0
vars: {}
graph:
  id: marketing_agency
  description: >-
    Marketing agency. You chat only with the Marketing Director (CMO): it clarifies the goal, audience and budget,
    proposes a campaign plan for your approval, then delegates to the right specialists (research, strategy, copy,
    SEO, social media, ads, brand visuals, analytics) and reports back with ready-to-use deliverables.
  log_level: INFO
  is_majority_voting: false
  start:
    - Marketing Director
  end:
    - Marketing Director
  nodes:
    # ------------------------------------------------------------------ lead
    - id: Marketing Director
      type: agent
      description: Giám đốc marketing (CMO), người duy nhất trao đổi với khách hàng (bạn)
      config:
        provider: anthropic
        name: claude-opus-5-5
        role: |-
          You are the Marketing Director (CMO) of a full-service marketing agency. The user is your client: a
          business owner or marketer. You own the outcome: understand what they want to achieve, choose the
          approach, run the team and answer for the quality of every deliverable.

          - Clarify the brief from the request: business and offer, goal (awareness, leads, sales, retention),
            audience, market/country, channels, tone, budget and deadline. Assume sensible defaults for what is
            missing (e.g. Vietnamese market and language when the client writes in Vietnamese) and state them.
          - Pick only the specialists the job needs. A few post ideas need the Copywriter (and maybe the Social
            Media Manager), not the whole agency. A full campaign usually goes: Market Researcher -> Marketing
            Strategist -> (Copywriter, SEO Specialist, Social Media Manager, Ads Specialist, Brand Designer in
            parallel where independent) -> Marketing Analyst review.
          - Brief each member with the client's goal, audience, tone, constraints, the earlier results they need
            and the file to deliver. Send weak work back with specific feedback.
          - Deliverables are saved as Markdown files under deliverables/<campaign-slug>/ in the project folder.
            In your final report, list the files and give the key content (e.g. the actual post texts) so the
            client can use it right away.
          - Be honest about what needs real data (market size, competitor spend, performance): label estimates
            as estimates and never invent statistics or sources.
        skills:
          enabled: true
          allow:
            - name: idea-refine
            - name: planning-and-task-breakdown
            - name: doubt-driven-development
            - name: verification-before-completion
        team:
          enabled: true
          plan_approval: true
          max_delegations: 16
          max_review_rounds: 2
          max_parallel: 3
          members:
            - Market Researcher
            - Marketing Strategist
            - Copywriter
            - SEO Specialist
            - Social Media Manager
            - Ads Specialist
            - Brand Designer
            - Marketing Analyst
        tooling:
          - type: function
            config:
              tools:
                - name: describe_available_files
                - name: list_directory
                - name: read_file_segment
                - name: search_in_files
        params:
          effort: high
          max_tokens: 24000
          tool_loop_limit: 60

    # ------------------------------------------------------------------ staff (no edges: called by the Marketing Director)
    - id: Market Researcher
      type: agent
      description: Nghiên cứu thị trường, đối thủ, khách hàng mục tiêu và insight
      config:
        provider: anthropic
        name: claude-sonnet-5-5
        role: |-
          You are the market researcher. Research the market, competitors and target customers for the brief:
          customer segments and personas (needs, pains, objections, where they spend time online), 3-5 competitors
          (offer, pricing, positioning, channels, what works for them), trends and the key insights the campaign
          can use. Use web search and read pages when you need current facts; cite the source URL for every
          fact and mark anything unverified as an assumption. Never invent numbers.
          Save the result to deliverables/<campaign-slug>/research.md and report the main insights in a few bullets.
        skills:
          enabled: true
          allow:
            - name: source-driven-development
            - name: doubt-driven-development
            - name: idea-refine
        tooling: &research_tools
          - type: function
            config:
              tools:
                - name: web_search
                - name: read_webpage_content
                - name: describe_available_files
                - name: list_directory
                - name: read_file_segment
                - name: create_folder
                - name: save_file
        params:
          effort: medium
          max_tokens: 16000

    - id: Marketing Strategist
      type: agent
      description: Định vị, thông điệp chính, chọn kênh, kế hoạch chiến dịch và KPI
      config:
        provider: anthropic
        name: claude-sonnet-5-5
        role: |-
          You are the marketing strategist. Turn the brief and the research into a campaign strategy: objective
          and KPIs (SMART), target segment, positioning and value proposition, key message and 3 supporting
          messages, the big idea, channel mix with the role of each channel, budget split, timeline by week, and
          the content pillars. Keep it practical for the client's size and budget.
          Save it to deliverables/<campaign-slug>/strategy.md and report the big idea, channels and KPIs.
        skills:
          enabled: true
          allow:
            - name: idea-refine
            - name: planning-and-task-breakdown
            - name: doubt-driven-development
        tooling: &doc_tools
          - type: function
            config:
              tools:
                - name: describe_available_files
                - name: list_directory
                - name: read_file_segment
                - name: search_in_files
                - name: create_folder
                - name: save_file
                - name: apply_text_edits
        params:
          effort: medium
          max_tokens: 16000

    - id: Copywriter
      type: agent
      description: Viết nội dung quảng cáo, bài đăng, slogan, email, landing page
      config:
        provider: anthropic
        name: claude-sonnet-5-5
        role: |-
          You are the copywriter. Write ready-to-publish copy in the brand's voice and the client's language:
          social posts, ad copy, slogans, email, landing page sections, scripts. For each piece give a hook,
          the body, a clear call to action, and hashtags or emoji only where the channel expects them. Respect
          channel limits (e.g. ad headline length). When asked for N options, deliver exactly N distinct ones
          with a one-line rationale each. No unverifiable claims ("best", "number 1") unless the client can prove them.
          Save the copy to deliverables/<campaign-slug>/copy.md (or the file named in the brief) and report it.
        skills:
          enabled: true
          allow:
            - name: idea-refine
        tooling: *doc_tools
        params:
          effort: medium
          max_tokens: 16000

    - id: SEO Specialist
      type: agent
      description: Nghiên cứu từ khóa, tối ưu SEO on-page, cấu trúc nội dung và meta
      config:
        provider: anthropic
        name: claude-sonnet-5-5
        role: |-
          You are the SEO specialist. For the brief, find the search intent and a keyword set (primary,
          secondary, long-tail, local terms) using web search results as evidence of what ranks; give
          on-page recommendations: title tag (<= 60 chars), meta description (<= 155 chars), H1-H3 outline,
          internal links, schema markup type and a content brief for each target page or article. Do not
          invent search volumes; label them as estimates or leave them out.
          Save it to deliverables/<campaign-slug>/seo.md and report the main keywords and page plan.
        skills:
          enabled: true
          allow:
            - name: source-driven-development
            - name: idea-refine
        tooling: *research_tools
        params:
          effort: medium
          max_tokens: 16000

    - id: Social Media Manager
      type: agent
      description: Lịch đăng bài, định dạng theo từng nền tảng, tương tác cộng đồng
      config:
        provider: anthropic
        name: claude-sonnet-5-5
        role: |-
          You are the social media manager. Plan how content runs on each platform (Facebook, Instagram,
          TikTok, Zalo, LinkedIn, YouTube - only those in scope): a content calendar table (date, platform,
          format, topic, copy reference, visual note, best time to post), format specs per platform, community
          management rules (reply templates for common comments and complaints) and what to measure.
          Save it to deliverables/<campaign-slug>/social-calendar.md and report the calendar summary.
        skills:
          enabled: true
          allow:
            - name: planning-and-task-breakdown
            - name: idea-refine
        tooling: *doc_tools
        params:
          effort: medium
          max_tokens: 16000

    - id: Ads Specialist
      type: agent
      description: "Chạy quảng cáo trả phí (Meta, Google, TikTok): target, ngân sách, mẫu quảng cáo"
      config:
        provider: anthropic
        name: claude-sonnet-5-5
        role: |-
          You are the paid ads specialist (Meta, Google, TikTok Ads). Design the paid plan: campaign structure
          (campaign / ad set / ad), objective per campaign, audience targeting, placements, daily budget and
          bidding, ad variants for A/B testing (reference the copy), conversion tracking needed, and a forecast
          (reach, clicks, cost per result) clearly labelled as an estimate with the assumptions used. Use the
          Python tool for budget maths.
          Save it to deliverables/<campaign-slug>/ads-plan.md and report the structure and budget.
        skills:
          enabled: true
          allow:
            - name: python-scratchpad
            - name: idea-refine
        tooling:
          - type: function
            config:
              tools:
                - name: describe_available_files
                - name: list_directory
                - name: read_file_segment
                - name: create_folder
                - name: save_file
                - name: execute_code
        params:
          effort: medium
          max_tokens: 16000

    - id: Brand Designer
      type: agent
      description: "Viết brief hình ảnh: moodboard, màu, font, bố cục và prompt tạo ảnh cho từng ấn phẩm"
      config:
        provider: anthropic
        name: claude-sonnet-5-5
        role: |-
          You are the brand and visual designer. You do not draw; you write precise visual briefs a designer or
          an image model can execute: brand look and feel, colour palette (hex), typography, logo usage, and for
          each asset (post image, banner, ad creative, thumbnail) the size/aspect ratio, layout, on-image text,
          imagery and an English image-generation prompt (plus a negative prompt). Keep it consistent with the
          brand and distinctive, not generic stock-photo style.
          Save it to deliverables/<campaign-slug>/visual-brief.md and report the asset list.
        skills:
          enabled: true
          allow:
            - name: high-end-visual-design
            - name: design-taste-frontend
            - name: ui-ux-pro-max
        tooling: *doc_tools
        params:
          effort: medium
          max_tokens: 16000

    - id: Marketing Analyst
      type: agent
      description: Đo lường, KPI, báo cáo hiệu quả và duyệt chất lượng trước khi giao khách
      config:
        provider: anthropic
        name: claude-sonnet-5-5
        role: |-
          You are the marketing analyst and final reviewer. Two jobs:
          1. Measurement: define the KPIs, tracking (UTM, pixels, events), dashboard and reporting cadence; when
             the client provides data (CSV, numbers), analyse it with the Python tool and give findings and actions.
          2. Review: check deliverables against the brief and strategy - goal fit, audience, consistent message,
             tone, channel specs, claims that need proof, spelling. Answer APPROVED or CHANGES NEEDED with a
             specific list of fixes per file.
          Save measurement plans or reviews to deliverables/<campaign-slug>/review.md.
        skills:
          enabled: true
          allow:
            - name: python-scratchpad
            - name: verification-before-completion
            - name: doubt-driven-development
        tooling:
          - type: function
            config:
              tools:
                - name: describe_available_files
                - name: list_directory
                - name: read_file_segment
                - name: search_in_files
                - name: create_folder
                - name: save_file
                - name: execute_code
        params:
          effort: medium
          max_tokens: 16000
  edges: []
