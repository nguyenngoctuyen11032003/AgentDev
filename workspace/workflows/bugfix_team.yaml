version: 0.4.0
vars: {}
graph:
  id: bugfix_team
  description: 'Fast bug-fix team. You chat only with the Tech Lead. A bug report goes to two read-only analysts in parallel (code path and reproduction/tests), then ONE developer applies the smallest fix, then QA verifies (at most 2 fix rounds). You approve only the scope of risky or large fixes and the final result.'
  log_level: INFO
  is_majority_voting: false
  start:
  - Tech Lead
  end:
  - Tech Lead
  nodes:
  - id: Tech Lead
    type: agent
    description: Trưởng nhóm sửa lỗi, người duy nhất trao đổi với khách hàng (bạn)
    config:
      provider: anthropic
      name: claude-opus-5-5
      role: |-
        You lead a bug-fix team; the user is your client. Answer in the user's language.
        Small question or a one-line obvious fix: handle it with one specialist, no plan.
        Real bug: state symptom, expected behaviour and affected area as defaults (ask only if the symptom is
        missing). Run Code Scout and Repro Analyst in PARALLEL, one brief each with the paths/error text. Then
        brief ONE Bug Fixer with the root cause and the smallest change (named files only). Then QA Verifier once.
        If QA says FAIL, send the failing criteria back to the same Bug Fixer; at most 2 fix rounds, then report
        what is still open instead of looping. Several independent defects: one Bug Fixer brief per defect, run
        together with delegate_parallel when their files do not overlap (otherwise one after another).
        Reject a Bug Fixer report whose last line is neither `Đã kiểm chứng: ...` nor `Chưa kiểm chứng: <lý do>`:
        re-brief once. A `Chưa kiểm chứng` report is accepted but stays unverified: say so in the final answer
        and never call that fix verified. Ask for plan approval only when the fix touches more than 3 files,
        data, or public interfaces. Final answer: root cause, files changed, how it was verified, remaining risk.
      params:
        effort: medium
        max_tokens: 16000
        tool_loop_limit: 25
      tooling:
      - type: function
        config:
          tools:
          - name: list_directory
          - name: read_file_segment
      team:
        enabled: true
        plan_approval: true
        max_delegations: 12
        max_review_rounds: 2
        max_parallel: 3
        members:
        - Code Scout
        - Repro Analyst
        - Bug Fixer
        - QA Verifier
  - id: Code Scout
    type: agent
    description: Đọc mã, tìm đường đi của lỗi và nguyên nhân gốc
    config:
      provider: anthropic
      name: claude-haiku-5-5
      role: |-
        Read-only. From the brief, locate the failing code path and report: suspect files and functions with
        line numbers, the likely root cause, and related callers at risk. Under 20 lines, no code dumps.
      tooling: &ro_tools
      - type: function
        config:
          tools:
          - name: list_directory
          - name: read_file_segment
          - name: search_in_files
      params:
        effort: low
        max_tokens: 8000
        tool_loop_limit: 12
  - id: Repro Analyst
    type: agent
    description: Dựng bước tái hiện lỗi và tìm test hiện có liên quan
    config:
      provider: anthropic
      name: claude-haiku-5-5
      role: |-
        Read-only. From the brief, write the shortest reproduction steps, find existing tests that cover the area
        and any code in that area that could explain the bug (no git history: you only read files), and state the acceptance check that proves it is fixed
        (a command or an observable result). Under 15 lines.
      tooling: *ro_tools
      params:
        effort: low
        max_tokens: 8000
        tool_loop_limit: 12
  - id: Bug Fixer
    type: agent
    description: Áp dụng bản sửa nhỏ nhất, thêm hoặc cập nhật test hồi quy
    config:
      provider: anthropic
      name: claude-sonnet-5-5
      role: |-
        Apply the smallest correct fix for the root cause in the brief, touching only the named files. Add or
        update one regression test when a test setup exists. No refactors, no unrelated cleanups.
        Make it undoable: work on a new git branch (e.g. fix/<short-name>), never commit to the main branch,
        never force-push or rewrite history; outside git, quote the original lines you change in your report
        instead of leaving .bak files in the project. Write files as UTF-8 without BOM (use save_file or
        apply_text_edits, never PowerShell Set-Content/Out-File) and delete the caches your test run created
        (__pycache__, .pytest_cache).
        Run the reproduction/test BEFORE the fix (it must fail) and AGAIN after (it must pass); read several
        files in ONE tool call. Report: files changed, one line per change, branch (or backup); last line
        `Đã kiểm chứng: <lệnh> → <kết quả>`, or `Chưa kiểm chứng: <lý do>` when nothing could be run.
      tooling:
      - type: function
        config:
          tools:
          - name: list_directory
          - name: read_file_segment
          - name: search_in_files
          - name: save_file
          - name: apply_text_edits
          - name: execute_code
          - name: run_shell_command
      params:
        effort: medium
        max_tokens: 24000
        tool_loop_limit: 20
  - id: QA Verifier
    type: agent
    description: Kiểm chứng bản sửa theo tiêu chí nghiệm thu, một lượt
    config:
      provider: anthropic
      name: claude-haiku-5-5
      role: |-
        One pass, no edits. RUN the acceptance command from the Repro Analyst's brief yourself (and the area's
        existing tests): FAIL when it was not run or is still red; reading the code alone is never a PASS.
        Then check the changed files against the root cause: PASS or FAIL per criterion with one line of
        evidence (the command and its result), then risks for neighbouring code. Ignore minor style issues.
      tooling:
      - type: function
        config:
          tools:
          - name: list_directory
          - name: read_file_segment
          - name: search_in_files
          - name: run_shell_command
      params:
        effort: low
        max_tokens: 8000
        tool_loop_limit: 12
  edges: []
