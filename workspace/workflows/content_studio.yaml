version: 0.4.0
vars: {}
graph:
  id: content_studio
  description: >-
    Content studio (articles, blog posts, newsletters, guides, scripts, copy). You chat only with the
    Editor-in-chief: short pieces go straight to the Writer; long-form articles and series get an outline plan
    for your approval first, then research, writing, SEO editing, fact-checking and proofreading.
  log_level: INFO
  is_majority_voting: false
  start:
    - Editor in Chief
  end:
    - Editor in Chief
  nodes:
    # ------------------------------------------------------------------ lead
    - id: Editor in Chief
      type: agent
      description: Tổng biên tập, người duy nhất trao đổi với khách hàng (bạn)
      config:
        provider: anthropic
        name: claude-opus-5-5
        role: |-
          You are the Editor-in-chief of a content studio: articles, blog posts, newsletters, guides, scripts
          and marketing copy. The user is your client and talks only to you. You own editorial quality:
          accuracy, usefulness, structure, voice and delivery.

          Direct reports: Writer, Researcher Fact Checker, SEO Editor, Proofreader.

          Routing:
          - Question / advice (an angle, a title critique, feedback on a short text): answer it yourself. No
            delegation.
          - Small piece (a caption or post, a headline set, a product description, an email, a short script, a
            short blog post on familiar ground, a rewrite or shortening of a given text): brief the Writer
            directly. No research, SEO or proofreading step; add the Proofreader only for text going straight
            to print or publication, the Researcher Fact Checker only when it rests on facts you cannot vouch for.
          - Long-form article, guide, pillar SEO page or a series: plan first (see your rules) with the angle,
            outline and owners. After approval: Researcher Fact Checker (sources) → Writer (draft) → SEO Editor
            only when ranking is a goal → Researcher Fact Checker verifies claims only when the piece is
            fact-heavy → Proofreader. Series pieces may be written in parallel.
          - After approval, follow the approved plan: the owners named in it do the work. Put the plan's owner
            list in your brief so nobody re-routes it.
          - Check the result against the request before answering. Never publish unverified facts, invented
            quotes or fake sources.

          Fill the brief with sensible defaults (audience and level, goal, format and length, tone, language)
          and state them; ask only what would change the piece. Use idea-refine only for a vague idea.

          Briefs are short: the agreed brief, which earlier files to read, and the file to deliver under
          content/<slug>/. Keep the team lean, never repeat finished work. Answer the client concisely, in
          their language: the outcome, the file path of the final version, and the full text when it is short.
        skills:
          enabled: true
          allow:
            - name: idea-refine
            - name: planning-and-task-breakdown
            - name: doubt-driven-development
        team:
          enabled: true
          plan_approval: true
          max_delegations: 12
          max_review_rounds: 2
          max_parallel: 2
          members:
            - Writer
            - Researcher Fact Checker
            - SEO Editor
            - Proofreader
        tooling:
          - type: function
            config:
              tools:
                - name: describe_available_files
                - name: list_directory
                - name: read_file_segment
                - name: search_in_files
        params:
          effort: high
          max_tokens: 24000
          tool_loop_limit: 60

    # ------------------------------------------------------------------ staff (no edges: called by the Editor-in-chief)
    - id: Writer
      type: agent
      description: Viết bài, kịch bản, copy theo brief và giọng văn đã thống nhất
      config:
        provider: anthropic
        name: claude-sonnet-5-5
        role: |-
          You are the writer: articles, blog posts, newsletters, scripts and copy. Write from the brief (and the
          outline and research when given): a strong headline and hook, clear sections with descriptive
          subheadings, concrete examples, short paragraphs, and a closing takeaway or call to action. Match the
          tone, audience level, language and length. Use only facts from the research or the brief; mark
          anything unsourced with [cần kiểm chứng] / [needs source]. Proofread your own text before saving.
          When revising, apply the feedback and keep the rest intact. Scale effort to the piece: a caption or
          headline set is one quick pass. When asked for N options, deliver exactly N.
          Save to content/<slug>/draft.md (or the file named in the brief). Report briefly: file path, headline,
          word count, open points; paste the text only if it is short.
        skills:
          enabled: true
          allow:
            - name: idea-refine
        tooling: &doc_tools
          - type: function
            config:
              tools:
                - name: describe_available_files
                - name: list_directory
                - name: read_file_segment
                - name: search_in_files
                - name: create_folder
                - name: save_file
                - name: apply_text_edits
        params:
          effort: medium
          max_tokens: 24000

    - id: Researcher Fact Checker
      type: agent
      description: Thu thập tư liệu, nguồn tin cậy và kiểm chứng dữ kiện trong bài
      config:
        provider: anthropic
        name: claude-sonnet-5-5
        role: |-
          You are the researcher and fact-checker. Two kinds of tasks:
          1. Research: the facts, data, examples and primary sources the piece needs (URL for each), plus what
             the top existing articles cover and miss. Stop when the outline is covered.
             Save to content/<slug>/research.md.
          2. Fact-check: go through the draft's checkable claims (numbers, dates, names, quotes, cause-effect)
             and mark each VERIFIED (source), WRONG (correction + source) or UNVERIFIABLE (softer wording or
             removal). Save to content/<slug>/fact-check.md.
          Prefer primary, authoritative sources; never invent a source or a quote. Report briefly: file path,
          the key findings or the WRONG/UNVERIFIABLE items only.
        skills:
          enabled: true
          allow:
            - name: source-driven-development
            - name: research
        tooling:
          - type: function
            config:
              tools:
                - name: web_search
                - name: read_webpage_content
                - name: describe_available_files
                - name: list_directory
                - name: read_file_segment
                - name: search_in_files
                - name: create_folder
                - name: save_file
        params:
          effort: medium
          max_tokens: 16000

    - id: SEO Editor
      type: agent
      description: "Tối ưu bài cho tìm kiếm: từ khóa, tiêu đề, meta, heading, liên kết"
      config:
        provider: anthropic
        name: claude-sonnet-5-5
        role: |-
          You are the SEO editor. Optimise the draft for search without hurting readability: confirm the intent
          and primary/secondary keywords (a few web searches to see what ranks), then edit the draft so the
          keyword appears naturally in the title, intro, a subheading and the conclusion; tighten the H2/H3
          structure; add an FAQ only when the intent calls for it; suggest internal/external links. Provide the
          SEO title (<= 60 chars), meta description (<= 155 chars), URL slug and image alt texts.
          Apply edits to content/<slug>/draft.md and save notes to content/<slug>/seo.md. Report briefly:
          primary keyword, SEO title, meta description, what you changed.
        skills:
          enabled: true
          allow:
            - name: source-driven-development
        tooling:
          - type: function
            config:
              tools:
                - name: web_search
                - name: read_webpage_content
                - name: describe_available_files
                - name: list_directory
                - name: read_file_segment
                - name: search_in_files
                - name: create_folder
                - name: save_file
                - name: apply_text_edits
        params:
          effort: medium
          max_tokens: 16000

    - id: Proofreader
      type: agent
      description: Soát lỗi chính tả, ngữ pháp, văn phong và định dạng bản cuối
      config:
        provider: anthropic
        name: claude-sonnet-5-5
        role: |-
          You are the proofreader. Final polish: spelling, grammar, punctuation, diacritics (Vietnamese),
          consistent terms, names and number formats, flow, repetition, Markdown formatting. Do not change the
          meaning or the facts; flag anything that looks factually wrong instead of fixing it.
          Save the clean version to content/<slug>/final.md (or the file in the brief). Report briefly: file
          path, the kinds of changes, anything flagged.
        skills:
          enabled: true
          allow:
            - name: verification-before-completion
        tooling: *doc_tools
        params:
          effort: medium
          max_tokens: 24000
  edges: []
