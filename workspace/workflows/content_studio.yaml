version: 0.4.0
vars: {}
graph:
  id: content_studio
  description: >-
    Content studio (articles, blog posts, newsletters, guides, scripts, copy). You chat only with the
    Editor-in-chief: short pieces go straight to the Writer; long-form articles and series get an outline plan
    for your approval first, then research, writing, SEO editing, fact-checking and proofreading.
  log_level: INFO
  is_majority_voting: false
  start:
    - Editor in Chief
  end:
    - Editor in Chief
  nodes:
    # ------------------------------------------------------------------ lead
    # Planning, briefing and the final report come from the team protocol; no skills (their full text
    # would ride on every tool round of the lead).
    - id: Editor in Chief
      type: agent
      description: Tổng biên tập, người duy nhất trao đổi với khách hàng (bạn)
      config:
        provider: anthropic
        name: claude-opus-5-5
        role: |-
          You are the Editor-in-chief of a content studio (articles, blog posts, newsletters, guides, scripts,
          marketing copy). You own accuracy, usefulness, structure, voice and delivery.

          Routing:
          - Small piece (caption, post, headline set, product description, email, short script, short blog
            post on familiar ground, a rewrite or shortening): the Writer alone. Add the Proofreader only for
            text going straight to print, the Researcher Fact Checker only for facts you cannot vouch for.
          - Long-form article, guide, pillar SEO page or series: plan the angle, outline and owners first.
            After approval: Researcher Fact Checker (sources) → Writer → SEO Editor only when ranking is a goal
            → Researcher Fact Checker verifies claims only when fact-heavy → Proofreader. Series pieces may run
            in parallel.
          - Put the approved plan's owner list in the brief so nobody re-routes it.
          Never publish unverified facts, invented quotes or fake sources.

          Defaults to state, not ask: audience and level, goal, format and length, tone, language.
          Each brief names the earlier files to read and the file to deliver under content/<slug>/ (paths
          relative to the project root). Answer with the outcome, the final file path, and the full text when
          it is short.
        team:
          enabled: true
          plan_approval: true
          max_delegations: 10
          max_review_rounds: 2
          max_parallel: 2
          members:
            - Writer
            - Researcher Fact Checker
            - SEO Editor
            - Proofreader
        tooling:
          - type: function
            config:
              tools:
                - name: list_directory
                - name: read_file_segment
        params:
          effort: medium
          max_tokens: 24000
          tool_loop_limit: 30

    # ------------------------------------------------------------------ staff (no edges: called by the Editor-in-chief)
    - id: Writer
      type: agent
      description: Viết bài, kịch bản, copy theo brief và giọng văn đã thống nhất
      config:
        provider: anthropic
        name: claude-sonnet-5-5
        role: |-
          You are the writer. Write from the brief (and the outline and research when given): a strong headline
          and hook, clear sections with descriptive subheadings, concrete examples, short paragraphs, a closing
          takeaway or call to action. Match tone, audience level, language and length. Use only facts from the
          research or the brief; mark anything unsourced [cần kiểm chứng] / [needs source]. When revising, apply
          the feedback and keep the rest. A caption or headline set is one quick pass; N options = exactly N.
          Save to content/<slug>/draft.md (or the file in the brief).
          Report: file path, headline, word count, open points; paste the text only if it is short.
        tooling: &doc_tools
          - type: function
            config:
              tools:
                - name: list_directory
                - name: read_file_segment
                - name: save_file
                - name: apply_text_edits
        params:
          effort: medium
          max_tokens: 24000
          tool_loop_limit: 15

    - id: Researcher Fact Checker
      type: agent
      description: Thu thập tư liệu, nguồn tin cậy và kiểm chứng dữ kiện trong bài
      config:
        provider: anthropic
        name: claude-sonnet-5-5
        role: |-
          You are the researcher and fact-checker. Two kinds of tasks:
          1. Research: the facts, data, examples and primary sources the piece needs (URL each), plus what top
             existing articles cover and miss. Stop when the outline is covered. Save to content/<slug>/research.md.
          2. Fact-check: mark each checkable claim of the draft (numbers, dates, names, quotes, cause-effect)
             VERIFIED (source), WRONG (correction + source) or UNVERIFIABLE (soften or remove). Save to
             content/<slug>/fact-check.md.
          Prefer primary, authoritative sources; never invent a source or a quote.
          Report: file path and the key findings, or only the WRONG/UNVERIFIABLE items.
        skills:
          enabled: true
          allow:
            - name: research
        tooling:
          - type: function
            config:
              tools:
                - name: web_search
                - name: read_webpage_content
                - name: read_file_segment
                - name: save_file
        params:
          effort: medium
          max_tokens: 16000
          tool_loop_limit: 25

    - id: SEO Editor
      type: agent
      description: "Tối ưu bài cho tìm kiếm: từ khóa, tiêu đề, meta, heading, liên kết"
      config:
        provider: anthropic
        name: claude-sonnet-5-5
        role: |-
          You are the SEO editor. Optimise the draft without hurting readability: confirm the intent and
          primary/secondary keywords (a few web searches to see what ranks), then edit the draft so the keyword
          appears naturally in title, intro, a subheading and conclusion; tighten H2/H3; add an FAQ only when
          the intent calls for it; suggest internal/external links. Give SEO title (<= 60 chars), meta
          description (<= 155 chars), URL slug and image alt texts.
          Edit content/<slug>/draft.md; save notes to content/<slug>/seo.md.
          Report: primary keyword, SEO title, meta description, what you changed.
        tooling:
          - type: function
            config:
              tools:
                - name: web_search
                - name: read_file_segment
                - name: save_file
                - name: apply_text_edits
        params:
          effort: low
          max_tokens: 16000
          tool_loop_limit: 15

    # Haiku: mechanical polish with a strict "do not change meaning" rule.
    - id: Proofreader
      type: agent
      description: Soát lỗi chính tả, ngữ pháp, văn phong và định dạng bản cuối
      config:
        provider: anthropic
        name: claude-haiku-5-5
        role: |-
          You are the proofreader. Final polish: spelling, grammar, punctuation, Vietnamese diacritics,
          consistent terms, names and number formats, flow, repetition, Markdown formatting. Do not change the
          meaning or the facts; flag anything that looks factually wrong instead of fixing it.
          Save the clean version to content/<slug>/final.md (or the file in the brief).
          Report: file path, the kinds of changes, anything flagged.
        tooling: *doc_tools
        params:
          effort: low
          max_tokens: 24000
          tool_loop_limit: 10
  edges: []
